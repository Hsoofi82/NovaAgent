name = "nova"
main = "src/index.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]

# Smaller upload + faster cold starts for a large worker.
minify = true
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Cron cadence: reminders are the only minute-sensitive job. The handler
# internally rate-limits the heavier sweeps (housekeeping, media cleanup) so a
# 1-minute trigger stays inside the Free-plan CPU budget per invocation.
[triggers]
crons = ["* * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

# ── D1 ────────────────────────────────────────────────────────────────────────
# Replace database_name/database_id with your real values:
#   npx wrangler d1 create nova-db
# The kv_store table used by the D1-backed KV shim is auto-migrated at runtime
# (see ensureCoreSchema in src/index.ts), so no manual SQL step is required.
[[d1_databases]]
binding = "DB"
database_name = "nova-db"
database_id = "00000000-0000-0000-0000-000000000000"

# ── R2 (optional, recommended) ────────────────────────────────────────────────
# Media blobs (generated images, voice notes, uploads) default to the D1-backed
# KV shim, where every blob is a `kv_store` row bound by D1's 2,000,000-byte
# per-value limit. Binding a bucket as MEDIA moves that binary out of D1:
#
#   npx wrangler r2 bucket create nova-media
#
# then uncomment the block below. No migration is needed — reads check R2 first
# and fall back to D1, so blobs written before the switch keep serving, and the
# per-blob size ceiling rises from ~1.5 MB to 24 MB (see MEDIA BLOB STORE in
# src/index.ts). Expiry is driven by cleanupExpiredMedia in the cron handler,
# since R2 objects have no per-object TTL.
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "nova-media"

# ── Non-secret configuration ─────────────────────────────────────────────────
# Only put NON-SENSITIVE values here. [vars] are stored in plaintext and are
# readable from the Cloudflare dashboard and in the deployed script.
[vars]
ENVIRONMENT = "production"
MAINTENANCE_MODE = "false"
BOT_OWNER_ID = "1558272627"
# Optional: URL of the animated loading GIF used by the progress panel.
LOADING_GIF_URL = ""

# ── Secrets ──────────────────────────────────────────────────────────────────
# All credentials below are SECRETS and must NOT be listed in [vars].
# Set each one with:  npx wrangler secret put <NAME>
#
#   TOKEN                    Telegram bot token
#   WEBHOOK_SECRET           Value expected in X-Telegram-Bot-Api-Secret-Token
#
#   GEMINI_KEY_1 .. GEMINI_KEY_5          Google Gemini API key pool
#
#   GOOGLE_SEARCH_API_KEY                 Google Programmable Search key
#   GOOGLE_SEARCH_ENGINE_ID               Google Programmable Search engine id
#
#   CF_ID_1 / CF_TOKEN_1                  Cloudflare account id + AI token
#   CF_ID_2 / CF_TOKEN_2                  (optional additional accounts)
#   CF_ID_3 / CF_TOKEN_3
#
#   ELEVENLABS_KEY_1 .. ELEVENLABS_KEY_6  ElevenLabs TTS key pool
#   ELEVENLABS_VOICE_ID                   (optional) override default voice
#   ELEVENLABS_MODEL_ID                   (optional) override default model
#
#   WALLET_ADDRESS                        (optional) shown by /donate
#   SEED_STICKER_SETS                     (optional) sticker sets to seed
